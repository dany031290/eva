<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodo de Prueba Finalizado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      max-width: 500px;
      width: 100%;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: #f0fdf4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: #16a34a;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      color: #1e293b;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.125rem;
      color: #475569;
      line-height: 1.6;
    }

    .accent {
      color: #16a34a;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    
    <h1>El periodo de prueba ha terminado</h1>
    <p>¡Muchas gracias por vuestra colaboración!</p>
  </main>

</body>
</html>
